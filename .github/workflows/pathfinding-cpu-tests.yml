name: Adaptive Pathfinding CPU Tests

on:
  pull_request:
    paths:
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/Pathfinding.java'
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/PathfindingThreadPolicy.java'
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/pathresults/PathResult.java'
      - 'src/main/java/com/minecolonies/api/configuration/ServerConfiguration.java'
      - 'test-support/performance/PathfindingWorkerRegression.java'
      - 'test-support/performance/create_pathfinding_stubs.py'
      - '.github/workflows/pathfinding-cpu-tests.yml'
  push:
    branches:
      - version/1.21
    paths:
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/**'
      - 'src/main/java/com/minecolonies/api/configuration/ServerConfiguration.java'
      - 'test-support/performance/PathfindingWorkerRegression.java'
      - 'test-support/performance/create_pathfinding_stubs.py'
      - '.github/workflows/pathfinding-cpu-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathfinding-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile real executor and policy, then exercise auto and manual worker counts
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/pathfinding-regression"
          mkdir -p "${work}/stubs" "${work}/classes"
          python3 test-support/performance/create_pathfinding_stubs.py "${work}/stubs"
          javac -encoding UTF-8 -d "${work}/classes" \
            $(find "${work}/stubs" -type f -name '*.java') \
            src/main/java/com/minecolonies/core/entity/pathfinding/PathfindingThreadPolicy.java \
            src/main/java/com/minecolonies/core/entity/pathfinding/Pathfinding.java \
            test-support/performance/PathfindingWorkerRegression.java
          java -ea -cp "${work}/classes" -Dpathfinding.override=0 PathfindingWorkerRegression
          java -ea -cp "${work}/classes" -Dpathfinding.override=4 PathfindingWorkerRegression
          java -ea -cp "${work}/classes" -Dpathfinding.override=1 PathfindingWorkerRegression
