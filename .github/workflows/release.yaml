name: Release

# The previous shared publishing workflow required the original publisher's
# configuration and failed before it could produce a downloadable mod JAR.
# This independent workflow builds this fork and attaches its own artifacts.
on:
  push:
    branches:
      - version/1.21
    paths:
      - 'src/**'
      - '.github/workflows/release.yaml'
  pull_request:
    paths:
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and publish MineColonies JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the mod
        run: ./gradlew --no-daemon build

      - name: Verify and stage the installable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # Pick the actual mod binary: sources, documentation and test JARs
          # are not installable Minecraft mods.
          candidates=()
          for candidate in build/libs/*.jar; do
            case "${candidate}" in
              *-sources.jar|*-javadoc.jar|*-test.jar|*-test-sources.jar|*-test-javadoc.jar)
                continue
                ;;
            esac
            if unzip -Z -1 "${candidate}" | grep -Eq '^META-INF/(neoforge.mods.toml|mods.toml)$'; then
              candidates+=("${candidate}")
            fi
          done
          if (( ${#candidates[@]} != 1 )); then
            echo "Expected exactly one NeoForge mod JAR; found ${#candidates[@]}."
            find build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          fi
          cp "${candidates[0]}" dist/
          (
            cd dist
            sha256sum *.jar > SHA256SUMS
          )
          ls -lh dist/*.jar
          cat dist/SHA256SUMS

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineColonies-1.21.1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish custom-fork GitHub prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/version/1.21'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="minecolonies-1.21.1-${SHORT_SHA}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.jar dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" dist/*.jar dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "MineColonies 1.21.1 custom build ${SHORT_SHA}" \
              --notes "Unofficial custom-fork MineColonies build for Minecraft 1.21.1 (NeoForge, Java 21). Built from commit ${GITHUB_SHA}. Install the normal required dependency mods separately. This release was build-tested in CI, not gameplay-tested." \
              --prerelease
          fi
          gh release view "${TAG}" --json url --jq .url
