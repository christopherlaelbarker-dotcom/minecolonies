name: NeoForge Server Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/neoforge-server-smoke.yml'
      - 'src/main/java/com/minecolonies/core/colony/**'
      - 'src/main/java/com/minecolonies/core/colony/managers/**'
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/**'
      - 'src/main/java/com/minecolonies/api/configuration/ServerConfiguration.java'
      - 'src/main/java/com/minecolonies/api/util/constant/CitizenConstants.java'
      - 'src/datagen/generated/minecolonies/data/minecolonies/researches/effects/citizencapaddition.json'
  push:
    branches:
      - version/1.21
    paths:
      - '.github/workflows/neoforge-server-smoke.yml'
      - 'src/main/java/com/minecolonies/core/colony/**'
      - 'src/main/java/com/minecolonies/core/entity/pathfinding/**'
      - 'src/main/java/com/minecolonies/api/configuration/ServerConfiguration.java'
      - 'src/main/java/com/minecolonies/api/util/constant/CitizenConstants.java'
      - 'src/datagen/generated/minecolonies/data/minecolonies/researches/effects/citizencapaddition.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify that the development server launch task exists
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon tasks --all > gradle-tasks.log
          grep -E '^[[:space:]]*runServer([[:space:]]|$)' gradle-tasks.log

      - name: Start a real headless NeoForge server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run runs/server runs/gametestserver
          for directory in run runs/server runs/gametestserver; do
            printf 'eula=true\n' > "${directory}/eula.txt"
          done

          ./gradlew --no-daemon runServer > neoforge-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!' neoforge-server.log; then
              echo "PASS: NeoForge dedicated server reached ready state."
              kill "${server_pid}" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              echo "FAIL: Server stopped before it was ready."
              tail -120 neoforge-server.log
              exit 1
            fi
            sleep 5
          done
          echo "FAIL: NeoForge server did not become ready within 10 minutes."
          tail -120 neoforge-server.log
          kill "${server_pid}" 2>/dev/null || true
          exit 1
      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-server-smoke-logs
          path: |
            gradle-tasks.log
            neoforge-server.log
          if-no-files-found: warn
          retention-days: 14
